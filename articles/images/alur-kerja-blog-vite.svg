<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Alur Kerja Blog LitaKu dengan Vite, Markdown, dan React</title>
  <desc id="diagram-desc">Diagram alur pemrosesan file Markdown dan gambar di folder articles menjadi halaman React dan hasil build di folder dist.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f766e" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#111827" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" rx="18" fill="#f9f8f5" />
  <rect x="1" y="1" width="958" height="438" rx="17" fill="none" stroke="#e5e2d9" stroke-width="2" />

  <!-- Header -->
  <text x="480" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#111827">
    Arsitektur Pengolahan Artikel di Blog LitaKu
  </text>
  <text x="480" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#6b7280">
    Pemisahan antara sumber konten (Markdown &amp; aset), parser JavaScript, dan komponen tampilan React
  </text>

  <!-- Step 1: Sumber Konten -->
  <g filter="url(#card-shadow)">
    <rect x="44" y="112" width="248" height="190" rx="14" fill="#ffffff" stroke="#e5e2d9" stroke-width="1.5" />
  </g>
  <rect x="64" y="130" width="98" height="24" rx="12" fill="rgba(15, 118, 110, 0.12)" />
  <text x="113" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">1. SUMBER DATA</text>
  <text x="64" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111827">Folder Konten</text>
  <rect x="64" y="198" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="76" y="221" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#0f766e">articles/*.md</text>
  <rect x="64" y="244" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="76" y="267" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#0f766e">articles/images/*</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="296" y1="207" x2="348" y2="207" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 2: Vite & Parser -->
  <g filter="url(#card-shadow)">
    <rect x="356" y="112" width="248" height="190" rx="14" fill="#ffffff" stroke="#e5e2d9" stroke-width="1.5" />
  </g>
  <rect x="376" y="130" width="112" height="24" rx="12" fill="rgba(15, 118, 110, 0.12)" />
  <text x="432" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">2. VITE &amp; PARSER</text>
  <text x="376" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111827">Olah Metadata &amp; Aset</text>
  <rect x="376" y="198" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="388" y="221" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="600" fill="#111827">import.meta.glob()</text>
  <rect x="376" y="244" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="388" y="267" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="600" fill="#111827">parseFrontmatter()</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="608" y1="207" x2="660" y2="207" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Step 3: React UI & Build -->
  <g filter="url(#card-shadow)">
    <rect x="668" y="112" width="248" height="190" rx="14" fill="#ffffff" stroke="#e5e2d9" stroke-width="1.5" />
  </g>
  <rect x="688" y="130" width="120" height="24" rx="12" fill="rgba(15, 118, 110, 0.12)" />
  <text x="748" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">3. TAMPILAN WEB</text>
  <text x="688" y="182" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111827">React + Tailwind CSS</text>
  <rect x="688" y="198" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="700" y="221" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="600" fill="#111827">ArticleCard &amp; Page</text>
  <rect x="688" y="244" width="208" height="36" rx="8" fill="#f3f0e8" />
  <text x="700" y="267" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="600" fill="#111827">MarkdownRenderer</text>

  <!-- Bottom Output Banner -->
  <rect x="44" y="334" width="872" height="68" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="68" y="363" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">
    Output Produksi (npm run build) → dist/
  </text>
  <text x="68" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#374151">
    Vite membungkus HTML, CSS, JavaScript, serta seluruh gambar dari articles/images/ ke dist/assets/ secara otomatis.
  </text>
</svg>
